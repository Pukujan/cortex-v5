name: workorder-fanin

on:
  workflow_call:
    inputs:
      work_order_json:
        required: true
        type: string
    outputs:
      closeout_json:
        value: ${{ jobs.fanin.outputs.closeout_json }}

permissions:
  contents: read

jobs:
  fanin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      closeout_json: ${{ steps.emit.outputs.closeout_json }}
    env:
      CORTEX_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_ORDER_JSON: ${{ inputs.work_order_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Cortex V5
        run: python -m pip install -e '.[test]'
      - name: Materialize and bind WorkOrder
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cortex_v5.workorders import validate_work_order

          order = validate_work_order(json.loads(os.environ["WORK_ORDER_JSON"]))
          if order["repo"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("WorkOrder repo does not match workflow repository")
          if order["base_sha"] != os.environ["CORTEX_SOFTWARE_COMMIT"]:
              raise SystemExit("WorkOrder base_sha does not match exact workflow checkout")
          Path("build/workorder").mkdir(parents=True, exist_ok=True)
          Path("build/workorder/order.json").write_text(
              json.dumps(order, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Download disposable attempt receipts
        uses: actions/download-artifact@v4
        with:
          pattern: workorder-receipt-*
          path: build/receipts
          merge-multiple: true
      - name: Mechanically validate fanin
        shell: bash
        run: |
          python -m cortex_v5.workorders fanin \
            build/workorder/order.json \
            build/receipts/receipt-*.json \
            --output build/workorder/closeout.json
      - name: Upload compact closeout transport
        uses: actions/upload-artifact@v4
        with:
          name: workorder-closeout
          path: build/workorder/closeout.json
          if-no-files-found: error
          retention-days: 1
      - name: Emit closeout output
        id: emit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          closeout = json.load(open("build/workorder/closeout.json", encoding="utf-8"))
          compact = json.dumps(closeout, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"closeout_json={compact}\n")
          PY
