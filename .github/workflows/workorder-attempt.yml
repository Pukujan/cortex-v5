name: workorder-attempt

on:
  workflow_call:
    inputs:
      work_order_json:
        required: true
        type: string
      attempt_json:
        required: true
        type: string
    outputs:
      receipt_json:
        value: ${{ jobs.attempt.outputs.receipt_json }}

permissions:
  contents: read

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt_json: ${{ steps.emit.outputs.receipt_json }}
    env:
      CORTEX_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_ORDER_JSON: ${{ inputs.work_order_json }}
      ATTEMPT_JSON: ${{ inputs.attempt_json }}
      EXECUTOR_MODE: fixture_executor_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Cortex V5
        run: python -m pip install -e '.[test]'
      - name: Materialize and bind attempt
        id: bind
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cortex_v5.workorders import validate_attempt, validate_work_order

          order = validate_work_order(json.loads(os.environ["WORK_ORDER_JSON"]))
          attempt = validate_attempt(order, json.loads(os.environ["ATTEMPT_JSON"]))
          if order["repo"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("WorkOrder repo does not match workflow repository")
          if order["base_sha"] != os.environ["CORTEX_SOFTWARE_COMMIT"]:
              raise SystemExit("WorkOrder base_sha does not match exact workflow checkout")
          Path("build/workorder").mkdir(parents=True, exist_ok=True)
          Path("build/workorder/order.json").write_text(
              json.dumps(order, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          Path("build/workorder/attempt.json").write_text(
              json.dumps(attempt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"attempt_id={attempt['attempt_id']}\n")
          PY
      - name: Run fixed secretless fixture executor verification
        id: verify
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_workorders.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Build structured attempt receipt
        shell: bash
        run: |
          python -m cortex_v5.workorders fixture-receipt \
            build/workorder/order.json \
            build/workorder/attempt.json \
            --verification-passed "${{ steps.verify.outputs.passed }}" \
            --output "build/workorder/receipt-${{ steps.bind.outputs.attempt_id }}.json"
          python - <<'PY'
          import json
          from pathlib import Path

          receipt_path = next(Path("build/workorder").glob("receipt-*.json"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          checkpoint = receipt["checkpoint"]
          target = Path("build/workorder") / checkpoint["artifact_ref"]
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(checkpoint, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload disposable receipt and checkpoint transport
        uses: actions/upload-artifact@v4
        with:
          name: workorder-receipt-${{ steps.bind.outputs.attempt_id }}
          path: |
            build/workorder/receipt-${{ steps.bind.outputs.attempt_id }}.json
            build/workorder/checkpoint/${{ steps.bind.outputs.attempt_id }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Emit receipt output
        id: emit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = next(Path("build/workorder").glob("receipt-*.json"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          compact = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"receipt_json={compact}\n")
          PY
      - name: Emit failure after receipt
        if: steps.verify.outputs.passed != 'true'
        shell: bash
        run: exit 1
