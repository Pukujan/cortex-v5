name: runner-death-chaos

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-then-die:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      CORTEX_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${CORTEX_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Cortex V5
        run: python -m pip install -e '.[test]'
      - name: Persist a bound checkpoint before runner loss
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from cortex_v5.workorders import fanout, validate_work_order

          now = datetime.now(UTC)
          stamp = now.isoformat().replace("+00:00", "Z")
          order = validate_work_order(
              {
                  "schema_version": "cortex.workorder.v1",
                  "work_order_id": f"wo_runner_death_{os.environ['GITHUB_RUN_ID']}",
                  "repo": os.environ["GITHUB_REPOSITORY"],
                  "base_sha": os.environ["CORTEX_SOFTWARE_COMMIT"],
                  "objective": "Prove fresh-runner recovery from an immutable checkpoint.",
                  "acceptance": {
                      "commands": ["python -m pytest -q tests/test_workorders.py"],
                      "required_files": ["cortex_v5/workorders.py"],
                  },
                  "risk": ["runner_death", "disposable_compute"],
                  "deadline": (now + timedelta(minutes=30)).isoformat().replace(
                      "+00:00", "Z"
                  ),
                  "idempotency_key": f"runner-death:{os.environ['GITHUB_RUN_ID']}",
                  "correlation": {
                      "project_issue_id": "fossil-core#94",
                      "task_id": "CORTEX-02",
                      "trace_id": f"runner_death_{os.environ['GITHUB_RUN_ID']}",
                  },
                  "generation": 1,
                  "attempt_count": 1,
                  "max_parallel": 1,
              }
          )
          attempt = fanout(order)[0]
          receipt = {
              "schema_version": "cortex.workorder-attempt-receipt.v1",
              "work_order_id": order["work_order_id"],
              "attempt_id": attempt["attempt_id"],
              "generation": order["generation"],
              "base_sha": order["base_sha"],
              "destination": attempt["destination"],
              "started_at": stamp,
              "finished_at": stamp,
              "status": "checkpointed",
              "checkpoint": {
                  "checkpoint_id": f"checkpoint_{attempt['attempt_id']}",
                  "completed_stage_ids": ["checkout", "execute"],
                  "next_stage_id": "verify",
                  "artifact_ref": "checkpoint/runner-death.json",
              },
              "verification": {
                  "passed": False,
                  "checks": ["checkpoint-persisted"],
                  "errors": ["expected disposable runner termination"],
              },
              "model_reported_done": False,
          }
          root = Path("build/runner-death")
          root.mkdir(parents=True, exist_ok=True)
          for name, value in (
              ("order.json", order),
              ("old-attempt.json", attempt),
              ("checkpoint-receipt.json", receipt),
          ):
              (root / name).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Upload checkpoint transport before termination
        uses: actions/upload-artifact@v4
        with:
          name: runner-death-checkpoint
          path: build/runner-death
          if-no-files-found: error
          retention-days: 1
      - name: Deliberately terminate disposable runner after checkpoint
        shell: bash
        run: exit 42

  recover-on-fresh-runner:
    if: ${{ always() }}
    needs: checkpoint-then-die
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORTEX_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${CORTEX_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Cortex V5
        run: python -m pip install -e '.[test]'
      - name: Download checkpoint from dead runner job
        uses: actions/download-artifact@v4
        with:
          name: runner-death-checkpoint
          path: build/runner-death
      - name: Reconcile on a fresh runner with a fenced generation
        shell: bash
        run: |
          python -m cortex_v5.workorders recover \
            build/runner-death/order.json \
            build/runner-death/checkpoint-receipt.json \
            --output build/runner-death/recovered-order.json
          python -m cortex_v5.workorders fanout \
            build/runner-death/recovered-order.json \
            --output build/runner-death/successors.json
          python - <<'PY'
          import json

          old = json.load(open("build/runner-death/old-attempt.json", encoding="utf-8"))
          order = json.load(
              open("build/runner-death/recovered-order.json", encoding="utf-8")
          )
          successor = json.load(
              open("build/runner-death/successors.json", encoding="utf-8")
          )[0]
          if order["generation"] != 2:
              raise SystemExit("runner-death recovery did not advance the generation")
          if successor["attempt_id"] == old["attempt_id"]:
              raise SystemExit("fresh-runner recovery reused the stale attempt identity")
          if successor["skip_stage_ids"] != ["checkout", "execute"]:
              raise SystemExit("fresh-runner recovery would replay completed stages")
          if successor["resume_from_checkpoint_id"] is None:
              raise SystemExit("fresh-runner recovery lost the checkpoint binding")
          PY
      - name: Prove deterministic recovery invariants
        run: |
          python -m pytest -q \
            tests/test_workorders.py::test_runner_death_recovery_advances_generation_and_fences_old_receipts \
            tests/test_workorders.py::test_runner_death_recovery_rejects_completed_or_unbound_checkpoint
