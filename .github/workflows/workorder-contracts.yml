name: WorkOrder contracts

on:
  pull_request:
    paths:
      - "cortex_v5/workorders.py"
      - "tests/test_workorders.py"
      - "tests/test_workorder_actions.py"
      - "examples/workorders/**"
      - ".github/workflows/workorder-*.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "cortex_v5/workorders.py"
      - "tests/test_workorders.py"
      - "tests/test_workorder_actions.py"
      - "examples/workorders/**"
      - ".github/workflows/workorder-*.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORTEX_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${CORTEX_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: WorkOrder contract oracles
        run: python -m pytest -q tests/test_workorders.py
      - name: Full Cortex V5 suite
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
